# Development stack: PostgreSQL only. Apps run on the host with `pnpm dev`.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jakab
      POSTGRES_USER: jakab
      POSTGRES_PASSWORD: jakab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jakab -d jakab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
