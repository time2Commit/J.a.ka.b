name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch/PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jakab
          POSTGRES_USER: jakab
          POSTGRES_PASSWORD: jakab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jakab -d jakab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://jakab:jakab@localhost:5432/jakab
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: PGPASSWORD=jakab psql -h localhost -U jakab -d jakab -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm'
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --filter @jakab/db generate
      - run: pnpm typecheck
      - run: pnpm --filter @jakab/db migrate:deploy
      - run: pnpm test
      - run: pnpm secrets

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jakab
          POSTGRES_USER: jakab
          POSTGRES_PASSWORD: jakab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jakab -d jakab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throwaway database: the E2E global setup resets it on every run.
      DATABASE_URL: postgresql://jakab:jakab@localhost:5432/jakab
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: PGPASSWORD=jakab psql -h localhost -U jakab -d jakab -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm'
      - run: pnpm --filter @jakab/db generate
      - run: pnpm --filter @jakab/db migrate:deploy
      # The Playwright webServer runs `pnpm build`, so the production build is verified here too.
      - run: pnpm --filter @jakab/web exec playwright install --with-deps chromium
      - run: pnpm --filter @jakab/web test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
