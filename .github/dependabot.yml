version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 3.0.10, 3.0.11 and 3.0.12 lose text when two people edit the same note
      # (two collaborative e2e tests fail), so every release from 3.0.10 is skipped.
      # Check new releases by hand and remove this once one passes the e2e tests.
      - dependency-name: "@tiptap/y-tiptap"
        versions: [">= 3.0.10"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
